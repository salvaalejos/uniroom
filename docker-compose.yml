version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: uniroom_db_v3
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: uniroom_user
      POSTGRES_PASSWORD: '12345'
      POSTGRES_DB: uniroom
    volumes:
      - ./postgres-data:/var/lib/postgresql/data_db

  backend:
    build:
      context: ./backend/app
      dockerfile: Dockerfile
    container_name: uniroom_backend
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://uniroom_user:12345@db:5432/uniroom?schema=public&connect_timeout=30&sslmode=disable"
      JWT_SECRET: "your_secret"
      RESEND_API_KEY: "${RESEND_API_KEY}"
    volumes:
      - ./backend/app:/app
      - /app/node_modules
    depends_on:
      - db