name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: bun test tests/unit/
        env:
          BUN_TEST: "true"

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: uniroom_user
          POSTGRES_PASSWORD: "12345"
          POSTGRES_DB: uniroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://uniroom_user:12345@localhost:5432/uniroom?schema=public"
          DIRECT_URL: "postgresql://uniroom_user:12345@localhost:5432/uniroom?schema=public"

      - name: Run integration tests
        run: bun test tests/integration/
        env:
          BUN_TEST: "true"
          DATABASE_URL: "postgresql://uniroom_user:12345@localhost:5432/uniroom?schema=public"
          DIRECT_URL: "postgresql://uniroom_user:12345@localhost:5432/uniroom?schema=public"
          JWT_SECRET: "test_secret"


